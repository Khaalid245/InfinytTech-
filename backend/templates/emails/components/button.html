<table width="100%" border="0" cellspacing="0" cellpadding="0">
    <tr>
        <td align="center" style="padding: 16px 0;">
            <table border="0" cellspacing="0" cellpadding="0">
                <tr>
                    <td align="center" style="border-radius: 6px;" bgcolor="{{ brand_colors.primary|default:'#2563eb' }}">
                        <a href="{{ url }}" target="_blank" style="font-size: 16px; font-family: Helvetica, Arial, sans-serif; color: #ffffff; text-decoration: none; border-radius: 6px; padding: 14px 28px; border: 1px solid {{ brand_colors.primary|default:'#2563eb' }}; display: inline-block; font-weight: bold;">
                            {{ label }}
                        </a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
