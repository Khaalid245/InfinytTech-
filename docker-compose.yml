services:
  mysql:
    image: mysql:8.4
    container_name: infinyttech-mysql
    restart: unless-stopped
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: infinyttech_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - infinyttech_mysql_data:/var/lib/mysql
    networks:
      - infinyttech_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  infinyttech_mysql_data:
    name: infinyttech_mysql_data

networks:
  infinyttech_net:
    name: infinyttech_net
